<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dino Walks Manhattan</title>
  </head>
  <body>
    <div id="hud">
      <h1>DINO WALKS MANHATTAN</h1>
      <p>Click to lock mouse · WASD move · A/D strafe · Shift sprint · LMB shoot</p>
      <div id="bars">
        <div class="bar">
          <span>YOU</span>
          <div class="track"><i id="hp-player"></i></div>
        </div>
        <div class="bar">
          <span>ENEMY</span>
          <div class="track enemy"><i id="hp-enemy"></i></div>
        </div>
      </div>
    </div>
    <div id="hint">Click the street to capture the mouse. Esc releases.</div>
    <div id="banner" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
